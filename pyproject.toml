[project]
name = "climax-prompt"
version = "0.0.1"
description = "Prompt for input via the CLI."
authors = [
    {name = "Snap",email = "XxSnapperGeexX@gmail.com"}
]
license = "LICENSE.txt"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "sphinx (>=9.1.0,<10.0.0)",
    "numpydoc (>=1.10.0,<2.0.0)",
    "flake8-bugbear (>=25.11.29,<26.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "groundwork-sphinx-theme (>=1.1.1,<2.0.0)"
]

[project.urls]
homepage = "https://gitlab.com/SnapperGee/climax-prompt-python"
repository = "https://gitlab.com/SnapperGee/climax-prompt-python"
issues = "https://gitlab.com/SnapperGee/climax-prompt-python/-/issues"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "climax/prompt", from = "src/main"}]

[tool.pytest]
testpaths = ["src/test"]
addopts = ["--import-mode=importlib"]

[tool.isort]
profile = "black"
src_paths = ["src"]

[tool.mypy]
files = ["src"]
strict = true
