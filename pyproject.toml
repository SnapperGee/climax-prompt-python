[project]
name = "climax-prompt"
version = "0.0.3"
description = "Prompt for input via the CLI."
authors = [
    {name = "Snap",email = "XxSnapperGeexX@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]

[dependency-groups]
dev = [
    "mypy (>=2.3.1,<3.0.0)",
    "sphinx (>=9.1.0,<10.0.0)",
    "numpydoc (>=1.10.0,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "furo (>=2025.12.19,<2026.0.0)",
    "ruff (>=0.16.5,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "pandoc (>=2.4,<3.0)",
]

[project.urls]
homepage = "https://gitlab.com/snap-climax/python-prompt"
repository = "https://gitlab.com/snap-climax/python-prompt"
issues = "https://gitlab.com/snap-climax/python-prompt/-/issues"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "climax/prompt", from = "src/main"}]

[tool.pytest]
testpaths = ["src/test"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
files = ["src"]
strict = true
mypy_path = ["src/main"]
explicit_package_bases = true
