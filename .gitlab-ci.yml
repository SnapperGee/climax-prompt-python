stages:
  - secret-detection
  - lint
  - test
  - build
  - publish
  - pages

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  PYTHON_SLIM_IMAGE: python:3.14.7-slim
  SECRET_DETECTION_ENABLED: "true"

.format_check:
  version_commit_tag: &version_commit_tag '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  version_like_commit_tag: &version_like_commit_tag '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'

.src_poetry_lock_pyproject_changes_rule:
  rules:
    - changes:
      - src/**/*
      - poetry.lock
      - pyproject.toml

.python_job_base:
  image: $PYTHON_SLIM_IMAGE
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POETRY_VIRTUALENVS_IN_PROJECT: "true"
  cache:
    key:
      files:
        - poetry.lock
    paths:
      - .cache/pip
      - .venv
  before_script:
    - pip install poetry
    - poetry install

.make_job_base:
  extends: .python_job_base
  before_script:
    - !reference [.python_job_base, before_script]
    - apt update && apt install -y --no-install-recommends make

.tox_job_base:
  image: ghcr.io/astral-sh/uv:debian-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
    UV_PYTHON_INSTALL_DIR: "$CI_PROJECT_DIR/.cache/uv-python"
  cache:
    key:
      files:
        - poetry.lock
    paths:
      - .cache/uv
      - .cache/uv-python
      - .tox
  before_script:
    - apt update && apt install -y --no-install-recommends make
    - uv tool install tox --with tox-uv

secret_detection:
  stage: secret-detection

version_tag_matches_project_version:
  image: $PYTHON_SLIM_IMAGE
  stage: lint
  rules:
    - if: *version_like_commit_tag
  before_script:
    - pip install poetry
  script:
    - |
      expected_tag="v$(poetry version -s)"
      if test "$CI_COMMIT_TAG" != "$expected_tag"; then
        printf 'Tag "%s" does not match expected tag "%s".\n' "$CI_COMMIT_TAG" "$expected_tag" >&2
        exit 1
      fi

poetry_check:
  extends: .make_job_base
  stage: lint
  rules:
    - changes:
      - poetry.lock
      - pyproject.toml
  script:
    - make poetry-check

ruff_check:
  extends: .make_job_base
  stage: lint
  rules: !reference [.src_poetry_lock_pyproject_changes_rule, rules]
  script:
    - make ruff-check

ruff_format_check:
  extends: .make_job_base
  stage: lint
  rules: !reference [.src_poetry_lock_pyproject_changes_rule, rules]
  script:
    - make ruff-format-check

mypy:
  extends: .tox_job_base
  stage: lint
  rules: !reference [.src_poetry_lock_pyproject_changes_rule, rules]
  script:
    - tox run -e mypy-py313,mypy-py314

unit_tests:
  extends: .tox_job_base
  stage: test
  rules: !reference [.src_poetry_lock_pyproject_changes_rule, rules]
  script:
    - tox run -e py313,py314
  coverage: '/TOTAL.*? (100(?:\.0+)?%|[1-9]?\d(?:\.\d+)?%)$/'
  artifacts:
    when: always
    expire_in: 1 week
    # paths:
    #   - build/test/results/
    #   - build/test/coverage/
    reports:
      junit:
        - build/test/results/xml/report.xml
        - build/test/results/py313/xml/report.xml
      coverage_report:
        coverage_format: cobertura
        path: build/test/coverage/xml/coverage.xml

package_build:
  image: $PYTHON_SLIM_IMAGE
  stage: build
  before_script:
    - pip install poetry twine
  script:
    - poetry check --strict --lock
    - poetry build
    - twine check --strict dist/*.tar.gz dist/*.whl
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: *version_commit_tag

publish_to_test_pypi:
  stage: publish
  image: $PYTHON_SLIM_IMAGE
  needs:
    - job: package_build
  environment:
    name: test-pypi
    url: https://test.pypi.org/project/climax-prompt/$CI_COMMIT_TAG
  rules:
    - if: *version_commit_tag
  id_tokens:
    TESTPYPI_ID_TOKEN:
      aud: testpypi
  before_script:
    - pip install twine
  script:
    - twine upload --repository-url https://test.pypi.org/legacy/ dist/*

publish_to_pypi:
  stage: publish
  image: $PYTHON_SLIM_IMAGE
  needs:
    - job: package_build
  environment:
    name: pypi
    url: https://pypi.org/project/climax-prompt/$CI_COMMIT_TAG
  artifacts:
    paths:
      - dist/
  rules:
    - if: *version_commit_tag
      when: manual
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  before_script:
    - pip install twine
  script:
    - twine upload dist/*

create_release:
  stage: publish
  image: "registry.gitlab.com/gitlab-org/cli:latest"
  needs:
    - job: publish_to_pypi
  rules:
    - if: *version_commit_tag
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - |
      glab release create "$CI_COMMIT_TAG" \
        --name "Release $CI_COMMIT_TAG" \
        --notes "PyPI release $CI_COMMIT_TAG" \
        --use-package-registry \
        "$(ls dist/*.tar.gz)#Source distribution#package" \
        "$(ls dist/*.whl)#Wheel#package"

pages:
  extends: .make_job_base
  stage: pages
  before_script:
    - !reference [.make_job_base, before_script]
    - apt install -y --no-install-recommends pandoc
  script:
    - make readme
    - make html
  pages:
    publish: build/docs/html
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/main/**/*
        - source/**/*
        - README.md
